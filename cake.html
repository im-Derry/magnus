<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday 🎉</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #0b1d3a;
    font-family: Arial, sans-serif;
}

#nextLink {
  display: none;              /* hidden initially */
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff4d6d;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  text-decoration: none;
}

/* 🎏 Flags */
.flags {
    position: absolute;
    top: 0;
    width: 100%;
    height: 100px;
    background: repeating-linear-gradient(
        45deg,
        red 0 20px,
        yellow 20px 40px,
        green 40px 60px,
        blue 60px 80px
    );
    clip-path: polygon(0 0,100% 0,100% 60%,95% 100%,90% 60%,85% 100%,80% 60%,75% 100%,70% 60%,65% 100%,60% 60%,55% 100%,50% 60%,45% 100%,40% 60%,35% 100%,30% 60%,25% 100%,20% 60%,15% 100%,10% 60%,5% 100%,0 60%);
}

/* 💬 Message */
.message {
    position: absolute;
    bottom: -200px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 32px;
    font-weight: bold;
    animation: riseMessage 4s ease forwards;
}

@keyframes riseMessage {
    0% { bottom: -200px; opacity: 0; }
    100% { bottom: 40%; opacity: 1; }
}

/* 🎈 Small Balloons */
.balloon {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0); }
    100% { transform: translateY(-120vh); }
}

/* 🎉 Confetti */
.confetti {
    position: absolute;
    width: 6px;
    height: 6px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="flags"></div>

<div class="message">
    It's a special day for you..!! 🎉<br>
    Happy Birthday 🎂
</div>

<script>

/* 🎈 Balloons (emoji style like 🎈) */
for (let i = 0; i < 25; i++) {
    let b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(b);
}

/* 🎉 Confetti */
for (let i = 0; i < 40; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    c.style.animationDuration = (2 + Math.random()*3) + "s";
    document.body.appendChild(c);
}

    setTimeout(() => {
  document.getElementById("nextLink").style.display = "block";
}, 3000);

</script>

<a id="nextLink" href="cakecut.html">Next </a>

</body>
</html>
