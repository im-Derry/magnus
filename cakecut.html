<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Cake</title>
<link rel="stylesheet" href="next.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#ffdde1,#ee9ca7);
}

/* Container */
.container{
    text-align:center;
    position:relative;
}

/* Message */
.message{
    position:absolute;
    top:-170px;
    width:100%;
    text-align:center;
    font-size:35px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 10px rgba(0,0,0,0.3);
    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
    100%{transform:translateY(0);}
}

/* Cake */
.cake{
    position:relative;
    width:320px;
    margin:auto;
    cursor:pointer;
}

/* Cake Layers */
.layer{
    position:relative;
    border-radius:20px;
    margin:auto;
    box-shadow:
        inset 0 -10px rgba(0,0,0,0.1),
        0 10px 20px rgba(0,0,0,0.2);
}

.layer1{
    width:320px;
    height:90px;
    background:linear-gradient(to right,#ff85a2,#ff4f81);
}

.layer2{
    width:270px;
    height:80px;
    background:linear-gradient(to right,#ffb6c1,#ff6f91);
    margin-top:-10px;
}

/* Cream Drips */
.drip{
    position:absolute;
    background:#fff0f5;
    border-radius:20px;
}

.drip1{
    width:25px;
    height:45px;
    top:70px;
    left:30px;
}

.drip2{
    width:20px;
    height:35px;
    top:65px;
    left:120px;
}

.drip3{
    width:30px;
    height:50px;
    top:70px;
    right:40px;
}

/* Candles */
.candles{
    position:absolute;
    top:-70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:30px;
}

.candle{
    width:16px;
    height:60px;
    background:repeating-linear-gradient(
        45deg,
        white,
        white 5px,
        pink 5px,
        pink 10px
    );
    border-radius:5px;
    position:relative;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

/* Flame */
.flame{
    position:absolute;
    width:18px;
    height:28px;
    background:radial-gradient(circle,yellow 20%,orange 70%);
    border-radius:50%;
    top:-30px;
    left:-1px;
    opacity:0;
    transform-origin:center bottom;
    animation:flicker .2s infinite alternate;
    box-shadow:0 0 20px orange;
}

.show{
    opacity:1;
}

@keyframes flicker{
    from{
        transform:rotate(-2deg) scale(1);
    }
    to{
        transform:rotate(2deg) scale(1.1);
    }
}

/* Buttons */
.buttons{
    margin-top:40px;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    color:white;
    background:#ff4081;
    transition:.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button:hover{
    transform:scale(1.05);
}

/* Cake Cut Animation */
.cutTop{
    transform:translateX(-40px) rotate(-8deg);
    transition:1s;
}

.cutBottom{
    transform:translateX(40px) rotate(8deg);
    transition:1s;
}

</style>
</head>

<body>

<div class="container">

    <!-- Message -->
    <div class="message" id="message">
        Light the candles 🎂
    </div>

    <!-- Cake -->
    <div class="cake" id="cake">

        <!-- Candles -->
        <div class="candles">

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

        </div>

        <!-- Cake Layers -->
        <div class="layer layer2"></div>

        <div class="layer layer1">
            <div class="drip drip1"></div>
            <div class="drip drip2"></div>
            <div class="drip drip3"></div>
        </div>

    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button id="lightBtn">Light Candles</button>
        <button id="blowBtn">Blow Candles</button>
    </div>

</div>

<!-- Audio -->
<audio id="clapAudio">
    <source src="https://www.soundjay.com/human/applause-8.mp3" type="audio/mp3">
</audio>

<script>

const flames = document.querySelectorAll(".flame");
const lightBtn = document.getElementById("lightBtn");
const blowBtn = document.getElementById("blowBtn");
const message = document.getElementById("message");
const cake = document.getElementById("cake");
const clapAudio = document.getElementById("clapAudio");

let candlesBlown = false;
let cakeCut = false;

/* Light Candles */
lightBtn.addEventListener("click",()=>{

    flames.forEach(flame=>{
        flame.classList.add("show");
    });

    message.innerHTML = "✨ Make a Wish ✨";
});

/* Blow Candles */
blowBtn.addEventListener("click",()=>{

    flames.forEach(flame=>{
        flame.classList.remove("show");
    });

    candlesBlown = true;

    message.innerHTML = "🎂 Now Cut the Cake 🎂";
});

/* Cut Cake */
cake.addEventListener("click",()=>{

    if(candlesBlown && !cakeCut){

        cakeCut = true;

        document.querySelector(".layer2")
        .classList.add("cutTop");

        document.querySelector(".layer1")
        .classList.add("cutBottom");

        message.innerHTML = "🎉 HAPPY BIRTHDAY 🎉";

        clapAudio.play();
    }
});

</script>

<!-- Next Button -->
<button id="nextBtn">Next ➜</button>

<style>
/* Hide button initially */
#nextBtn{
    display:none;
    padding:12px 25px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:#ff4081;
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>


<a href="balloongame.html">Next</a>
</body>
</html>
